<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="User Security Role Table Access">
  <defs>
    <linearGradient id="gShield" x1="4" y1="2" x2="28" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF4A63"/>
      <stop offset="0.55" stop-color="#EE163B"/>
      <stop offset="1" stop-color="#B00E2A"/>
    </linearGradient>
    <linearGradient id="gPlate" x1="8" y1="9" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE3E8"/>
    </linearGradient>
  </defs>

  <!-- shield -->
  <path fill="url(#gShield)"
        d="M16 1.8 27.1 5.5c.54.18.9.68.9 1.24v8.02c0 7.32-4.5 12.6-11.55 15.33a1.25 1.25 0 0 1-.9 0C8.5 27.36 4 22.08 4 14.76V6.74c0-.56.36-1.06.9-1.24Z"/>

  <!-- permission matrix: three rows, each a table with granted/denied cells -->
  <g fill="url(#gPlate)">
    <rect x="8.4" y="10.1" width="6.6" height="2.5" rx="1.25"/>
    <rect x="16.4" y="10.1" width="7.2" height="2.5" rx="1.25"/>

    <rect x="8.4" y="14.6" width="6.6" height="2.5" rx="1.25"/>
    <rect x="16.4" y="14.6" width="2.5" height="2.5" rx="1.25" opacity="0.45"/>
    <rect x="20.3" y="14.6" width="3.3" height="2.5" rx="1.25"/>

    <rect x="8.4" y="19.1" width="6.6" height="2.5" rx="1.25"/>
    <rect x="16.4" y="19.1" width="4.4" height="2.5" rx="1.25" opacity="0.45"/>
  </g>

  <!-- tick: access verified -->
  <path fill="none" stroke="url(#gPlate)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
        d="m11.6 23.9 2.5 2.6 5.4-5.7"/>
</svg>
