# Publishes the Power Platform ToolBox package to npm, from which the PPTB Tool Registry picks it up.
#
# Uses npm Trusted Publishing (OIDC): no NPM_TOKEN, no automation token, no secret of any kind is
# stored anywhere, and no 2FA prompt blocks the run. npmjs.com trusts a policy naming this repository
# and this workflow file, and npm exchanges the job's OIDC token for a short-lived credential at
# publish time. The policy on npmjs.com must therefore match:
#
#     Organization or user   TheMarkChristie
#     Repository             user-security-role-table-access
#     Workflow filename      publish-npm.yml     <- this file's name; renaming it breaks the trust
#     Environment            (blank)
#
# Token-based publishing is deliberately absent: npm has retired the token 2FA bypass, so OIDC is
# now the only unattended route. If a NODE_AUTH_TOKEN or NPM_TOKEN ever reappears below, it is wrong.
#
# ubuntu, not windows (unlike publish-nuget.yml): this package is just HTML plus a manifest, so
# there is nothing platform-specific to build.

name: Publish User Access Explorer to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write   # required to mint the OIDC token npm exchanges for a publish credential
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # node 24 ships npm >= 11.5.1, which is the floor for trusted publishing.
      # registry-url is not optional: without it npm never points at registry.npmjs.org and the
      # OIDC exchange has nowhere to happen.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # No npm ci / npm install: the package has no dependencies, and npm-shrinkwrap.json is
      # generated by the build below rather than committed, so there is no lockfile to install from.
      #
      # The build is mandatory, not a convenience. pptb/dist/, README.md, LICENSE and
      # npm-shrinkwrap.json are all gitignored inside pptb/, so a fresh checkout has none of them -
      # build.js copies the canonical webresource HTML into dist/index.html, copies the icon and the
      # root README/LICENSE alongside it, and regenerates npm-shrinkwrap.json from package.json.
      # Skipping it would publish an empty package, not merely a stale one.
      - name: Build the ToolBox package
        working-directory: pptb
        run: npm run build

      # Publishes what "files" allows - dist/ and npm-shrinkwrap.json - plus the package.json,
      # README.md and LICENSE npm always includes. Provenance attestations are generated
      # automatically under trusted publishing, so --provenance is not passed.
      - name: Publish
        working-directory: pptb
        run: npm publish --access public
